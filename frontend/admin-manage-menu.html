<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - مدیریت منو و تخفیف‌ها</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <div class="main-wrapper">
      <div class="container" style="max-width: 900px;">

        <!-- فرم تنظیم ساعات کاری -->
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px;">
          <h2>⏰ تنظیم ساعات کاری سفارش‌گیری</h2>
          <form id="working-hours-form" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; margin-top: 15px;">
            <div class="form-group" style="margin: 0; flex: 1;">
              <label>ساعت شروع:</label>
              <input type="time" id="opening-time" required />
            </div>
            <div class="form-group" style="margin: 0; flex: 1;">
              <label>ساعت پایان:</label>
              <input type="time" id="closing-time" required />
            </div>
            <div class="form-group" style="margin: 0; flex: 1;">
              <label>وضعیت سیستم:</label>
              <select id="system-status">
                <option value="true">فعال (باز)</option>
                <option value="false">غیرفعال (تعطیل)</option>
              </select>
            </div>
            <button type="submit" style="width: auto;">ذخیره ساعات کاری</button>
          </form>
        </div>

        <!-- فرم ساخت و مدیریت کدهای تخفیف (مخصوص ادمین) -->
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px;">
          <h2>🎟️ تعریف و مدیریت کدهای تخفیف</h2>
          <form id="add-discount-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
              <div class="form-group" style="flex: 1; margin:0;">
                <label>کد تخفیف (مثلاً OFF20):</label>
                <input type="text" id="discount-code" placeholder="کد تخفیف" required style="text-transform: uppercase;" />
              </div>
              <div class="form-group" style="flex: 1; margin:0;">
                <label>درصد تخفیف (1 تا 100):</label>
                <input type="number" id="discount-percent" placeholder="مثلاً 20" min="1" max="100" required />
              </div>
            </div>
            <div class="form-group">
              <label>تاریخ انقضا:</label>
              <input type="date" id="discount-expiry" required />
            </div>
            <button type="submit" style="width: auto; background: #854d0e;">ایجاد کد تخفیف</button>
          </form>

          <!-- جدول لیست کدهای تخفیف فعال -->
          <h3 style="margin-top: 25px; font-size: 16px;">📋 کدهای تخفیف ثبت‌شده در سیستم</h3>
          <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
            <thead>
              <tr style="background: #f8f9fa; text-align: right;">
                <th style="padding: 8px; border: 1px solid #ddd;">کد</th>
                <th style="padding: 8px; border: 1px solid #ddd;">درصد</th>
                <th style="padding: 8px; border: 1px solid #ddd;">تاریخ انقضا</th>
                <th style="padding: 8px; border: 1px solid #ddd; text-align: center;">عملیات</th>
              </tr>
            </thead>
            <tbody id="discounts-table-body">
              <tr><td colspan="4" style="padding: 10px; text-align: center;">در حال بارگذاری...</td></tr>
            </tbody>
          </table>
        </div>
        
        <!-- فرم ثبت دسته‌بندی جدید -->
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px;">
          <h2>📂 افزودن دسته‌بندی جدید</h2>
          <form id="add-category-form" class="admin-form" style="grid-template-columns: 1fr auto; margin-top: 15px;">
            <input type="text" id="category-name" placeholder="نام دسته‌بندی (مثلاً نوشیدنی، پیش‌غذا)" required />
            <button type="submit" class="btn-submit-cat" style="width: auto;">ثبت دسته‌بندی</button>
          </form>
        </div>

        <!-- فرم ثبت غذای جدید -->
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color);">
          <h2>➕ افزودن غذای جدید به منو</h2>
          <form id="add-menu-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <div class="form-group">
              <label>نام غذا:</label>
              <input type="text" id="menu-name" placeholder="نام غذا (مثلاً پیتزا پپرونی)" required />
            </div>
            <div class="form-group">
              <label>توضیحات غذا:</label>
              <input type="text" id="menu-desc" placeholder="توضیحات کوتاه" required />
            </div>
            <div style="display: flex; gap: 15px;">
              <div class="form-group" style="flex: 1;">
                <label>قیمت (تومان):</label>
                <input type="number" id="menu-price" placeholder="قیمت" required />
              </div>
              <div class="form-group" style="flex: 1;">
                <label>تعداد موجودی:</label>
                <input type="number" id="menu-stock" placeholder="موجودی" min="0" value="10" required />
              </div>
            </div>
            <div class="form-group">
              <label>عکس غذا:</label>
              <input type="file" id="menu-image-file" accept="image/*" />
            </div>
            <div class="form-group">
              <label>انتخاب دسته‌بندی:</label>
              <select id="menu-category" required>
                <option value="">در حال بارگذاری دسته‌بندی‌ها...</option>
              </select>
            </div>
            <button type="submit" class="btn-submit-food" style="width: 100%;">ثبت غذا در منو</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin-manage-menu.js"></script>
</body>
</html>
