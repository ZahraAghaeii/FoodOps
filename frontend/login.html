<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - ورود به حساب</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-split-card">
      <!-- سمت راست: عکس قرار داده شده -->
      <div class="auth-image-side">
        <img src="images/loginPage.png" alt="FoodOps Login">
      </div>

      <!-- سمت چپ: فرم لاگین -->
      <div class="auth-form-side">
        <h2>ورود به سیستم FoodOps</h2>
        <form id="loginForm">
          <div class="form-group">
            <label>آدرس ایمیل:</label>
            <input type="email" id="loginEmail" required placeholder="example@gmail.com">
          </div>
          <div class="form-group">
            <label>رمز عبور:</label>
            <input type="password" id="loginPassword" required placeholder="******">
          </div>
          <button type="submit" class="btn-submit">ورود به حساب</button>
        </form>

        <div class="switch-link">
          حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/auth';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          alert('ورود با موفقیت انجام شد!');
          window.location.href = 'index.html';
        } else {
          alert(data.message || 'ایمیل یا رمز عبور اشتباه است');
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور');
      }
    });
  </script>
</body>
</html>
