<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - ورود به حساب</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 20px; color: #333; }
    .form-group { margin-bottom: 15px; text-align: right; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #219150; }
    .switch-link { margin-top: 20px; font-size: 14px; color: #666; }
    .switch-link a { color: #2980b9; text-decoration: none; font-weight: bold; }
    .switch-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>ورود به FoodOps</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>ایمیل:</label>
        <input type="email" id="loginEmail" required placeholder="example@gmail.com">
      </div>
      <div class="form-group">
        <label>رمز عبور:</label>
        <input type="password" id="loginPassword" required placeholder="******">
      </div>
      <button type="submit">ورود</button>
    </form>

    <div class="switch-link">
      حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/auth';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          alert('ورود با موفقیت انجام شد!');
          // هدایت به صفحه اصلی یا منو
          // window.location.href = 'index.html';
        } else {
          alert(data.message || 'ایمیل یا رمز عبور اشتباه است');
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور');
      }
    });
  </script>
</body>
</html>
