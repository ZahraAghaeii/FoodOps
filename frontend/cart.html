<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - سبد خرید</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <div class="main-wrapper">
      <div class="container">
        <h2>🛒 سبد خرید فعلی شما</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
          <div style="flex: 2; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
            <ul class="cart-items" id="cartItems">
              <p>در حال بارگذاری سبد خرید...</p>
            </ul>
            
            <!-- بخش کد تخفیف -->
            <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border-color);">
              <label style="font-weight: bold; display: block; margin-bottom: 8px;">🎫 کدهای تخفیف پیشنهادی:</label>
              <!-- کدهای تخفیف فعال اینجا به صورت تگ‌های قابل کلیک لود می‌شوند -->
              <div id="publicDiscountsContainer" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                <span style="font-size: 12px; color: #666;">در حال بارگذاری کدهای تخفیف...</span>
              </div>

              <div style="display: flex; gap: 10px;">
                <input type="text" id="discountCodeInput" placeholder="کد تخفیف را وارد کنید" style="flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; text-transform: uppercase;" />
                <button type="button" onclick="applyDiscountCode()" style="background: var(--light-brown); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; width: auto;">اعمال تخفیف</button>
              </div>
              <p id="discountMessage" style="font-size: 13px; margin-top: 6px; color: #16a34a;"></p>
            </div>

            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
              <span>مبلغ قابل پرداخت:</span>
              <span id="totalPrice" style="color: var(--primary-orange);">۰ تومان</span>
            </div>
            <button onclick="checkoutOrder()" id="checkoutBtn" disabled style="margin-top: 20px;">✅ تایید و ارسال به آشپزخانه</button>
          </div>

          <div style="flex: 1; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; height: fit-content;">
            <h3>پیگیری سفارشات</h3>
            <button onclick="window.location.href='orders.html?tab=pending'">⏳ سفارشات در حال انجام</button>
            <button onclick="window.location.href='orders.html?tab=history'" style="background-color: var(--light-brown);">📜 تاریخچه کلی سفارشات</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
