<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - سبد خرید</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <div class="main-wrapper">
      <div class="container">
        <h2>🛒 سبد خرید فعلی شما</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
          <div style="flex: 2; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color);">
            <ul class="cart-items" id="cartItems">
              <p>در حال بارگذاری سبد خرید...</p>
            </ul>
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
              <span>مبلغ قابل پرداخت:</span>
              <span id="totalPrice" style="color: var(--primary-orange);">۰ تومان</span>
            </div>
            <button onclick="checkoutOrder()" id="checkoutBtn" disabled style="margin-top: 20px;">✅ تایید و ارسال به آشپزخانه</button>
          </div>

          <div style="flex: 1; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; height: fit-content;">
            <h3>پیگیری سفارشات</h3>
            <button onclick="window.location.href='orders.html?tab=pending'">⏳ سفارشات در حال انجام</button>
            <button onclick="window.location.href='orders.html?tab=history'" style="background-color: var(--light-brown);">📜 تاریخچه کلی سفارشات</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
