<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - پروفایل کاربر</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <div class="main-wrapper">
      <div class="container" style="max-width: 900px;">
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px;">
          <h2>👤 ویرایش اطلاعات شخصی</h2>
          <form id="profile-form" style="margin-top: 15px;">
            <div class="form-group">
              <label>نام و نام خانوادگی:</label>
              <input type="text" id="prof-name" required />
            </div>
            <div class="form-group">
              <label>آدرس ایمیل:</label>
              <input type="email" id="prof-email" required />
            </div>
            <div class="form-group">
              <label>شماره تلفن:</label>
              <input type="text" id="prof-phone" />
            </div>
            <div class="form-group">
              <label>رمز عبور جدید:</label>
              <input type="password" id="prof-password" placeholder="******" />
            </div>
            <button type="submit" style="width: auto;">ذخیره تغییرات</button>
          </form>
        </div>

        <!-- بخش ثبت پرسنل مخصوص ادمین -->
        <div id="admin-create-staff-section" style="display: none; background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px;">
          <h2>➕ ثبت‌نام پرسنل جدید</h2>
          <form id="create-staff-form" style="margin-top: 15px;">
            <div class="form-group">
              <label>نام کامل:</label>
              <input type="text" id="staff-name" required />
            </div>
            <div class="form-group">
              <label>ایمیل:</label>
              <input type="email" id="staff-email" required />
            </div>
            <div class="form-group">
              <label>رمز عبور اولیه:</label>
              <input type="password" id="staff-password" required />
            </div>
            <div class="form-group">
              <label>تعیین نقش:</label>
              <select id="staff-role" required>
                <option value="Kitchen Staff">مسئول آشپزخانه (Kitchen Staff)</option>
                <option value="Cashier">صندوق‌دار (Cashier)</option>
              </select>
            </div>
            <button type="submit" style="width: auto;">ثبت پرسنل جدید</button>
          </form>
        </div>

        <!-- بخش لیست کاربران مخصوص ادمین -->
        <div id="admin-users-list-section" style="display: none; background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color);">
          <h2>👥 مدیریت کاربران</h2>
          <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
              <tr style="background: #f8f9fa;">
                <th style="padding: 10px;">نام</th>
                <th style="padding: 10px;">ایمیل</th>
                <th style="padding: 10px;">نقش فعلی</th>
                <th style="padding: 10px;">تغییر نقش</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="4">در حال دریافت کاربران...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
