<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - تغییر رمز عبور اجباری</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-split-card" style="max-width: 500px;">
      <div class="auth-form-side" style="width: 100%;">
        <h2>🔒 تغییر رمز عبور موقت</h2>
        <p style="font-size: 13px; color: #666; text-align: center; margin-bottom: 20px;">
          شما با رمز عبور موقت وارد شده‌اید. جهت ادامه استفاده از سیستم، لطفاً یک رمز عبور جدید تعیین کنید.
        </p>

        <form id="changePasswordForm">
          <div class="form-group">
            <label>رمز عبور جدید:</label>
            <input type="password" id="newPassword" required placeholder="حداقل ۶ کاراکتر" />
          </div>
          <div class="form-group">
            <label>تکرار رمز عبور جدید:</label>
            <input type="password" id="confirmPassword" required placeholder="تکرار رمز عبور" />
          </div>
          <button type="submit" class="btn-submit">ثبت رمز جدید و ورود به سیستم</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_AUTH = 'http://localhost:5000/api/auth';

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('رمز عبور جدید و تکرار آن مطابقت ندارند.');
        return;
      }

      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const res = await fetch(`${API_AUTH}/change-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ newPassword })
        });

        const data = await res.json();
        if (res.ok) {
          alert('رمز عبور با موفقیت تغییر کرد! 🎉');
          
          // آپدیت وضعیت user در LocalStorage
          const user = JSON.parse(localStorage.getItem('user') || '{}');
          user.isPasswordTemp = false;
          localStorage.setItem('user', JSON.stringify(user));

          window.location.href = 'index.html';
        } else {
          alert(data.message || 'خطا در تغییر رمز عبور');
        }
      } catch (err) {
        console.error(err);
        alert('ارتباط با سرور برقرار نشد.');
      }
    });
  </script>
</body>
</html>
