<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - سفارش آنلاین غذا</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>سیستم سفارش آنلاین FoodOps</h1>
    <div class="header-right">
        <ul class="navbar">
            <li id="cart-nav-item">
                <a href="cart.html">
                    🛒 سبد خرید 
                    <span id="cart-count">0</span>
                </a>
            </li>
        </ul>
        <div class="user-info">
            <span id="userName">کاربر مهمان</span>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>
  </header>

  <div class="container">
    <!-- فرم ثبت دسته‌بندی جدید (مخصوص ادمین) -->
    <div id="admin-category-section" class="admin-section">
      <h2>📂 افزودن دسته‌بندی جدید</h2>
      <form id="add-category-form" class="admin-form" style="grid-template-columns: 1fr auto;">
        <input type="text" id="category-name" placeholder="نام دسته‌بندی (مثلاً نوشیدنی، پیش‌غذا)" required />
        <button type="submit" class="btn-submit-cat">ثبت دسته‌بندی</button>
      </form>
    </div>

    <!-- فرم ثبت غذای جدید (مخصوص ادمین) -->
    <div id="admin-menu-section" class="admin-section">
      <h2>➕ افزودن غذای جدید به منو</h2>
      <form id="add-menu-form" class="admin-form">
        <input type="text" id="menu-name" placeholder="نام غذا (مثلاً پیتزا پپرونی)" required />
        <input type="text" id="menu-desc" placeholder="توضیحات غذا" required />
        <input type="number" id="menu-price" placeholder="قیمت (تومان)" required />
        <select id="menu-category" required>
          <option value="">در حال بارگذاری دسته‌بندی‌ها...</option>
        </select>
        <button type="submit" class="btn-submit-food">ثبت غذا</button>
      </form>
    </div>

    <div class="main-content">
      <!-- منوی غذاها -->
      <div class="menu-section">
        <h2>منوی غذا و نوشیدنی</h2>
        <!-- نوار فیلتر دسته‌بندی‌ها -->
        <div class="category-filter-bar" id="categoryFilterBar">
          <button class="filter-btn active" onclick="filterMenu('all', this)">همه</button>
        </div>
        <div class="menu-grid" id="menuGrid">
          <p>در حال دریافت منو...</p>
        </div>
      </div>

      <!-- سبد خرید -->
      <div class="cart-section">
        <h2>سبد خرید شما</h2>
        <ul class="cart-items" id="cartItems">
          <p style="font-size: 13px; color: #888;">سبد خرید شما خالی است.</p>
        </ul>
        <div class="cart-total">
          <span>جمع کل:</span>
          <span id="totalPrice">۰ تومان</span>
        </div>
        <button class="btn-checkout" onclick="submitOrder()">ثبت و نهایی‌سازی سفارش</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
