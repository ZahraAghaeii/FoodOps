<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - سیستم سفارش آنلاین غذا</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- نوبار عمودی سمت راست -->
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <!-- محتوای اصلی سمت چپ -->
    <div class="main-wrapper">
      <div class="hero-banner">
        <div class="hero-overlay"></div>
      </div>

      <div class="container">
        <!-- منوی اصلی غذاها -->
        <div class="menu-section">
          <h2>منوی غذا و نوشیدنی</h2>
          <div style="margin: 15px 0;">
            <input type="text" id="menuSearchInput" placeholder="🔍 جستجوی نام غذا یا نوشیدنی..." oninput="handleSearchInput()" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; outline: none;">
          </div>
          <div class="category-filter-bar" id="categoryFilterBar">
            <button class="filter-btn active" onclick="filterMenu('all', this)">همه</button>
          </div>
          <div class="menu-grid" id="menuGrid">
            <p>در حال دریافت منو...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
