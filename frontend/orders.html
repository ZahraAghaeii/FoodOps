<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodOps - پیگیری و تاریخچه سفارشات</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ========================================== */
        /*           استایل‌های اختصاصی سفارشات        */
        /* ========================================== */
        .orders-container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* تب‌ها (Tabs) */
        .tabs-header {
            display: flex;
            gap: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: #f1f5f9;
            color: #475569;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
            width: auto;
        }

        .tab-btn.active {
            background: #2c3e50;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        /* کارت‌های سفارش */
        .order-card {
            background: #fdfefe;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            border-right: 5px solid #f39c12;
            /* رنگ پیش‌فرض برای در حال انجام */
        }

        .order-card.status-preparing {
            border-right-color: #3498db;
        }

        .order-card.status-ready {
            border-right-color: #2ecc71;
        }

        .order-card.status-delivered {
            border-right-color: #27ae60;
        }

        .order-card.status-cancelled {
            border-right-color: #e74c3c;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .order-items-list {
            list-style: none;
            margin: 10px 0;
            padding-right: 0;
        }

        .order-items-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px dashed #f8f9fa;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-weight: bold;
            font-size: 15px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
        }

        .status-Pending {
            background: #f39c12;
        }

        .status-Preparing {
            background: #3498db;
        }

        .status-Ready {
            background: #2ecc71;
        }

        .status-Delivered {
            background: #27ae60;
        }

        .status-Cancelled {
            background: #e74c3c;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1 onclick="window.location.href='index.html'" style="cursor: pointer;">🍽️ سیستم سفارش آنلاین FoodOps</h1>
        <div class="header-right">
            <ul class="navbar">
                <li id="cart-nav-item" style="display: block;">
                    <a href="cart.html">🛒 سبد خرید <span id="cart-count">0</span></a>
                </li>
            </ul>
            <div class="user-info">
                <span id="userName">در حال بارگذاری...</span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </div>
    </header>

    <!-- بنر صفحه اصلی -->
    <div class="hero-banner">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <div class="orders-container">
            <a href="cart.html" class="back-link">← بازگشت به سبد خرید</a>

            <!-- دکمه‌های تب -->
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('pending')" id="btnPending">⏳ سفارشات در حال
                    انجام</button>
                <button class="tab-btn" onclick="switchTab('history')" id="btnHistory">📜 تاریخچه سفارشات</button>
            </div>

            <!-- محتوای لیست سفارشات -->
            <div id="ordersList">
                <p style="text-align: center; color: #888; padding: 20px;">در حال دریافت اطلاعات...</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
