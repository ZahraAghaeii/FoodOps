<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOps - پیگیری سفارشات</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <nav class="sidebar-nav" id="main-sidebar"></nav>

    <div class="main-wrapper">
      <div class="container" style="max-width: 900px;">
        <div style="background: white; padding: 25px; border-radius: 10px; border: 1px solid var(--border-color);">
          <div style="display: flex; gap: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px;">
            <button class="filter-btn active" onclick="switchTab('pending')" id="btnPending">⏳ سفارشات در حال انجام</button>
            <button class="filter-btn" onclick="switchTab('history')" id="btnHistory">📜 تاریخچه سفارشات</button>
          </div>
          <div id="ordersList">
            <p>در حال دریافت اطلاعات...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
